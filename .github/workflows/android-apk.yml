name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK oficial universal
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Java 17 + cache Gradle
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/app/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter 3.47.1
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
          pub-cache: true

      - name: Detectar assinatura disponível
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PRESENT=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [ -n "$value" ] && PRESENT=$((PRESENT + 1))
          done
          if [ "$PRESENT" -eq 0 ]; then
            echo "official=false" >> "$GITHUB_OUTPUT"
            echo "Sem Secrets: será gerado APK de teste."
          elif [ "$PRESENT" -ne 4 ]; then
            echo "::error::Assinatura incompleta. Configure os 4 Secrets ou remova todos."
            exit 1
          else
            echo "official=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            cat > android/key.properties <<KEYEOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          KEYEOF
          fi

      - name: Dependências
        run: flutter pub get

      - name: Validar versão canônica
        run: bash tool/check_version_sync.sh

      - name: Materializar Gradle Wrapper
        run: bash tool/bootstrap_gradle_wrapper.sh

      - name: Validar assinatura oficial configurada
        if: steps.signing.outputs.official == 'true'
        shell: bash
        run: |
          cd android
          bash gradlew :app:validateOfficialSigning

      - name: Compilar APK universal
        env:
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
        run: flutter build apk --release --no-pub

      - name: Validar APK, assinatura e compatibilidade
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$SOURCE" || { echo "APK não foi gerado em $SOURCE" >&2; exit 1; }

          unzip -l "$SOURCE" | grep -q 'lib/armeabi-v7a/libflutter.so' || { echo "APK sem armeabi-v7a (32-bit)" >&2; exit 1; }
          unzip -l "$SOURCE" | grep -q 'lib/arm64-v8a/libflutter.so' || { echo "APK sem arm64-v8a (64-bit)" >&2; exit 1; }

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" "$SDK_ROOT/tools" -type f -name apkanalyzer 2>/dev/null | head -n1 || true)"
          test -x "$APKANALYZER" || { echo "apkanalyzer não encontrado"; exit 1; }

          EXPECTED_ID="$(sed -n 's/^applicationId=//p' android/release-signing.properties | head -n1)"
          ACTUAL_ID="$("$APKANALYZER" manifest application-id "$SOURCE")"
          test "$ACTUAL_ID" = "$EXPECTED_ID" || { echo "applicationId incorreto: $ACTUAL_ID"; exit 1; }

          SIGNING_MODE="test"
          if [ "${{ steps.signing.outputs.official }}" = "true" ]; then
            SIGNING_MODE="official"
          fi
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)"
          VERSION_NAME="${VERSION%%+*}"
          VERSION_CODE="${VERSION##*+}"
          if [ "$SIGNING_MODE" = "official" ]; then
            FILE="GitHub-Manager-${VERSION_NAME}-${VERSION_CODE}-universal-release.apk"
          else
            FILE="GitHub-Manager-${VERSION_NAME}-${VERSION_CODE}-test.apk"
          fi
          BYTES="$(stat -c%s "$SOURCE")"
          MIB="$(awk -v b="$BYTES" 'BEGIN { printf "%.2f", b / 1048576 }')"
          mkdir -p dist
          cp "$SOURCE" "dist/$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "size_mib=$MIB" >> "$GITHUB_OUTPUT"

      - name: Publicar APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.file }}
          path: dist/${{ steps.package.outputs.file }}
          # APK direto: evita ZIP externo/compressão adicional e acelera o download.
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Resumo
        shell: bash
        run: |
          {
            echo "## APK gerado com sucesso"
            echo ""
            echo "- Arquivo: \`${{ steps.package.outputs.file }}\`"
            echo "- Tamanho: **${{ steps.package.outputs.size_mib }} MiB**"
            echo "- versionName: \`${{ steps.package.outputs.version_name }}\`"
            echo "- versionCode: \`${{ steps.package.outputs.version_code }}\`"
            echo "- applicationId: \`br.com.githubmanager.app\`"
            echo "- Compatibilidade: **armeabi-v7a + arm64-v8a**"
            if [ "${{ steps.signing.outputs.official }}" = "true" ]; then
              echo "- Assinatura: **oficial definitiva**"
            else
              echo "- Assinatura: **teste (debug)**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar material de assinatura
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
