name: Verificação do Projeto (CI)

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analisar e testar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Flutter 3.47.1
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
          pub-cache: true

      - name: Dependências
        run: flutter pub get

      - name: Validar versão canônica
        run: bash tool/check_version_sync.sh

      - name: Verificar formatação
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analisar código
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Executar testes
        run: flutter test --no-pub
