# Compatibilidade com importadores incrementais: ao enviar este ZIP, este
# arquivo substitui o CI antigo que permaneceu no GitHub após a versão 2.0.118.
# Não executa em push/pull_request e nunca agenda runner, mesmo manualmente.
# Quando possível, exclua definitivamente este arquivo da branch main.
name: GitHub Manager CI (legado desativado)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    name: CI antiga desativada
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'CI legada desativada; utilize GitHub Manager Android APK.'
